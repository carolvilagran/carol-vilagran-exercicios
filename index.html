<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espaço Terapêutico | Carol Vilagran</title><style>:root{font:16px system-ui;color:#47393d;background:#f8f3ef}*{box-sizing:border-box}body{margin:0}header{background:#673a49;color:white;padding:25px}main{max-width:900px;margin:auto;padding:24px}h1{font:2rem Georgia;color:#673a49}h2{font:1.45rem Georgia}article{background:white;padding:23px;border:1px solid #eadfda;border-radius:15px;margin:16px 0}button{border:0;background:#673a49;color:white;border-radius:9px;padding:13px 18px;cursor:pointer;margin:6px 5px 6px 0}button.alt{background:#e9dcdb;color:#673a49}input[type=text],textarea{width:100%;padding:12px;border:1px solid #c9babb;border-radius:8px;font:inherit}textarea{min-height:90px}label{display:block;margin:13px 0}small,.muted{color:#736b6c}nav{margin:15px 0} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.grid article{margin:0} .note{background:#f2e6e2;padding:14px;border-radius:9px}</style><header><b>Carol Vilagran</b> · Espaço Terapêutico</header><main id="app"></main><script>
const W='5585987760087';
const E=[
['Plano de ação para um casal ocupado demais',['Quais momentos da rotina dificultam a conexão?','Que atitudes de apreciação podem ser praticadas diariamente?','Qual ritual de conexão de 10 a 20 minutos podem criar?','Como conversar sobre finanças sem acusações?','Que objetivo financeiro comum desejam construir?','Qual ação concreta será realizada nesta semana?']],
['Primeira entrevista: história do relacionamento',['Como se conheceram?','O que inicialmente atraiu você no parceiro?','Como foi o primeiro encontro?','Quando decidiram assumir um compromisso?','Quais tensões apareceram no início?','Como foi a fase do casamento ou início da convivência?','Como lidaram com as primeiras grandes mudanças?','Quais foram os melhores momentos?','Como estão o lazer e a intimidade?','O que mudou desde o primeiro ano?','Quais objetivos desejam construir juntos?']],
['Identificando a área central do conflito',['Avalie as áreas abaixo, de 1 (completamente satisfeito) a 6 (completamente insatisfeito): finanças, filhos, afeto, sexo, carreira, tarefas domésticas, confiança/ciúmes, família extensa, lazer, álcool/drogas, religião, humor/emoções, prioridades/decisões, comportamento/aparência e outras. Registre cada nota.','Quais são as três áreas prioritárias para trabalhar?','O que tornaria essas áreas mais satisfatórias?']],
['Solicitação de mudança comportamental',['Descreva um comportamento específico do parceiro que gera frustração, sem ataques pessoais.','Como você se sente quando isso acontece?','Que mudança concreta gostaria de solicitar?','Que segundo comportamento gostaria de abordar?','Que mudança concreta gostaria de solicitar nesse segundo caso?','Após conversar, como seu parceiro avalia a dificuldade de cada mudança: fácil, média ou difícil?']],
['Como eu contribuo para o conflito central',['Qual conflito se repete com mais frequência?','O que costuma acontecer imediatamente antes?','Como meus próprios comportamentos contribuem para manter o conflito?','Quais reações minhas pioram a situação?','Quais comportamentos meus ajudam a reduzir o conflito?','Que mudança pessoal posso começar nesta semana?']],
['Questionário pré-sessão de casal',['Como você descreve a relação atualmente e há quanto tempo estão juntos?','Qual é a principal preocupação que trouxe vocês à terapia?','Com que frequência e intensidade o problema acontece?','Quais são seus objetivos com a terapia?','O que já tentaram fazer para melhorar?','Quais são os pontos fortes da relação?','De 1 a 10, qual seu nível atual de felicidade na relação?','Que mudanças você espera de si e do parceiro?','Já fizeram terapia de casal? Como foi?','Há acompanhamento psicológico individual?','O uso de álcool ou outras substâncias interfere na relação?','Já houve conversas sobre separação?','Como avalia a satisfação sexual?','Quais fontes externas de estresse afetam o casal?']],
['O que eu sinto quando o conflito ocorre?',['Descreva brevemente uma situação de conflito recente.','Quais emoções aparecem? Considere: ofendido, isolado, controlado, frustrado, ansioso, humilhado, rejeitado, triste, com medo, irritado, impotente, envergonhado, entre outras.','Quais emoções são mais intensas?','O que você costuma fazer quando sente isso?','O que gostaria que seu parceiro compreendesse sobre esses sentimentos?']],
['Renovando os votos',['O que aprendi sobre mim nesta relação?','O que mais admiro em meu parceiro hoje?','Que momentos da nossa história desejo honrar?','Quais dificuldades enfrentamos e o que aprendemos?','Que atitudes quero cultivar na nossa relação?','Que futuro desejo construir ao lado do parceiro?','Escreva seus novos votos, com compromissos concretos e realistas.']]
];
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let params=new URLSearchParams(location.search),ids=(params.get('e')||'').split(',').map(Number).filter(i=>i>=0&&i<E.length),mode=params.get('m')==='j'?'compartilhado':'individual';let answers={};
function admin(){app.innerHTML='<h1>Biblioteca terapêutica</h1><p>Selecione os exercícios que deseja enviar. Esta é uma versão de demonstração, sem login ou armazenamento de dados.</p><article><h2>Escolha os exercícios</h2>'+E.map((e,i)=>'<label><input type="checkbox" class="pick" value="'+i+'"> '+esc(e[0])+'</label>').join('')+'<h2>Modalidade</h2><label><input type="radio" name="m" value="i" checked> Individual (cada parceiro responde separadamente)</label><label><input type="radio" name="m" value="j"> Compartilhado (resposta conjunta)</label><button id="gen">Gerar link</button><div id="out"></div></article><p class="note">Atenção: qualquer pessoa com o link pode abrir os exercícios. Não inclua nomes de pacientes na URL. Não use para dados clínicos reais sem proteção de acesso.</p>';document.getElementById('gen').onclick=()=>{let v=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!v.length)return alert('Selecione ao menos um exercício.');let u=location.origin+location.pathname+'?e='+v.join(',')+'&m='+document.querySelector('[name=m]:checked').value;document.getElementById('out').innerHTML='<label>Link gerado<input type="text" id="url" readonly value="'+esc(u)+'"></label><button id="copy">Copiar</button><button id="open">Testar</button>';document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(u).then(()=>alert('Copiado')).catch(()=>prompt('Copie:',u));document.getElementById('open').onclick=()=>location.href=u;};}
function home(){app.innerHTML='<h1>Seu espaço de reflexão</h1><p>Atividades '+(mode==='individual'?'individuais':'compartilhadas')+'. Responda no seu ritmo. Nenhuma resposta é enviada automaticamente.</p><p class="note">As respostas permanecem nesta página até o envio manual. Evite usar aparelhos compartilhados. O WhatsApp poderá manter cópias das mensagens.</p><div class="grid">'+ids.map(i=>'<article><h2>'+esc(E[i][0])+'</h2><p>'+E[i][1].length+' perguntas</p><button data-id="'+i+'">Começar</button></article>').join('')+'</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>exercise(+b.dataset.id));}
function exercise(i){let e=E[i];app.innerHTML='<button class="alt" id="back">← Voltar</button><h1>'+esc(e[0])+'</h1><p>Responda com liberdade. Você pode deixar perguntas sem resposta.</p><form id="form"><article>'+e[1].map((q,k)=>'<label><strong>'+(k+1)+'. '+esc(q)+'</strong><textarea name="q'+k+'" aria-label="Resposta '+(k+1)+'">'+esc(answers[i]?.[k]||'')+'</textarea></label>').join('')+'</article><button type="submit">Concluir e revisar respostas</button></form>';document.getElementById('back').onclick=home;document.getElementById('form').onsubmit=ev=>{ev.preventDefault();answers[i]=e[1].map((_,k)=>ev.target.elements['q'+k].value);finish(i)};}
function finish(i){let e=E[i],report='Carol Vilagran | '+e[0]+'\nModalidade: '+mode+'\n\n'+e[1].map((q,k)=>(k+1)+'. '+q+'\n'+(answers[i][k]||'(sem resposta)')).join('\n\n');app.innerHTML='<h1>Exercício concluído</h1><p>Revise antes de enviar. O envio não é automático.</p><textarea id="report" style="min-height:320px">'+esc(report)+'</textarea><nav><button id="wa">Abrir WhatsApp</button><button class="alt" id="copy">Copiar respostas</button><button class="alt" id="again">Voltar aos exercícios</button></nav><p class="note">Ao enviar, o conteúdo poderá permanecer no histórico do WhatsApp. Evite enviar informações que não deseja compartilhar por esse canal.</p>';document.getElementById('wa').onclick=()=>window.open('https://wa.me/'+W+'?text='+encodeURIComponent(document.getElementById('report').value),'_blank');document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(document.getElementById('report').value).then(()=>alert('Copiado'));document.getElementById('again').onclick=home;}
ids.length?home():admin();
</script></html>
